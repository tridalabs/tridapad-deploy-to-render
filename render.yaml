databases:
  # TridaPad database (larger plan than the old 256 MB)
  - name: tridapad-database
    databaseName: tridapad
    user: tridapad
    plan: basic-1gb

  # Separate database for AgentSQL
  - name: tridapad-agentsql-database
    databaseName: agentsql
    user: agentsql
    plan: basic-1gb

services:
  # Managed Redis for TridaPad caching and job queues
  - type: keyvalue
    name: tridapad-redis
    ipAllowList: []  # Only allow internal connections
    plan: standard
    maxmemoryPolicy: noeviction  # Don't evict data for job queues

  # Separate managed Redis for AgentSQL
  - type: keyvalue
    name: tridapad-agentsql-redis
    ipAllowList: []
    plan: standard
    maxmemoryPolicy: noeviction

  # Main TridaPad web service
  # IMPORTANT: After creating this service, run `render-tridapad create_db`
  # in Render Shell to initialize the database.
  - type: web
    name: tridapad
    env: docker
    plan: pro
    dockerCommand: render-tridapad server
    autoDeploy: false
    envVars:
      - key: TRIDAPAD_DATABASE_URL
        fromDatabase:
          name: tridapad-database
          property: connectionString
      - key: TRIDAPAD_REDIS_URL
        fromService:
          type: keyvalue
          name: tridapad-redis
          property: connectionString
      - key: TRIDAPAD_AGENTSQL_SERVICE_ENABLED
        value: "true"
      - key: TRIDAPAD_AGENTSQL_SERVICE_URL
        sync: false  # Set to your agentsql web service URL, e.g. https://agentsql-xxxx.onrender.com
      - key: TRIDAPAD_CHAT_WIDGET_ENABLED
        value: "true"
      - fromGroup: tridapad-shared
      - fromGroup: tridapad-mail
      - fromGroup: tridapad-oauth

  # Background worker for query execution
  - type: worker
    name: tridapad-worker
    env: docker
    plan: pro
    dockerCommand: render-tridapad worker
    autoDeploy: false
    envVars:
      - key: TRIDAPAD_DATABASE_URL
        fromDatabase:
          name: tridapad-database
          property: connectionString
      - key: TRIDAPAD_REDIS_URL
        fromService:
          type: keyvalue
          name: tridapad-redis
          property: connectionString
      - fromGroup: tridapad-shared
      - fromGroup: tridapad-mail
      - fromGroup: tridapad-oauth
      - key: QUEUES
        value: "queries,scheduled_queries,schemas,periodic,emails,default"

  # Scheduler for periodic tasks (separate service in production)
  - type: worker
    name: tridapad-scheduler
    env: docker
    plan: pro
    dockerCommand: render-tridapad scheduler
    autoDeploy: false
    envVars:
      - key: TRIDAPAD_DATABASE_URL
        fromDatabase:
          name: tridapad-database
          property: connectionString
      - key: TRIDAPAD_REDIS_URL
        fromService:
          type: keyvalue
          name: tridapad-redis
          property: connectionString
      - fromGroup: tridapad-shared
      - fromGroup: tridapad-mail
      - fromGroup: tridapad-oauth

  # AgentSQL: natural-language questions to SQL and dashboards
  # IMPORTANT: After creating this service, run `render-agentsql create_db`
  # in Render Shell to initialize its database.
  - type: web
    name: agentsql
    env: image
    plan: pro
    image:
      url: docker.io/tridalabs/agentsql:1.0.5
    autoDeploy: false
    healthCheckPath: /livez
    envVars:
      - key: AGENTSQL_DATABASE_URL
        fromDatabase:
          name: tridapad-agentsql-database
          property: connectionString
      - key: AGENTSQL_REDIS_URL
        fromService:
          type: keyvalue
          name: tridapad-agentsql-redis
          property: connectionString
      - key: AGENTSQL_DB_TYPE
        value: postgres
      - key: AGENTSQL_LOG_LEVEL
        value: INFO
      - key: TRIDAPAD_BASE_URL
        sync: false  # Set to your tridapad web service URL
      - key: MCP_SERVER_URL
        sync: false  # Set to your tridapad-mcp URL, ending in /mcp
      - key: CORS_ORIGINS
        sync: false  # JSON list, e.g. ["https://tridapad-xxxx.onrender.com"]
      - key: ANTHROPIC_API_KEY
        sync: false  # Your Anthropic API key
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: AGENTSQL_API_SECRET_KEY
        generateValue: true

  # TridaPad MCP server: lets AI tools query TridaPad over HTTP
  - type: web
    name: tridapad-mcp
    runtime: image
    image:
      url: docker.io/tridalabs/tridapad-mcp:1.2.5
    plan: pro
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: TRANSPORT
        value: http
      - key: MCP_HOST
        value: "0.0.0.0"
      - key: MCP_PORT
        value: "8080"
      - key: LOG_LEVEL
        value: INFO
      - key: TRIDAPAD_URL
        sync: false  # Set to your tridapad web service URL
      - key: TRIDAPAD_MAX_ROWS
        value: "5000"
      - key: TRIDAPAD_SQL_SAFETY
        value: readonly
      - key: TRIDAPAD_TIMEOUT
        value: "30"
      - key: TRIDAPAD_STRUCTURED_ERRORS
        value: "true"
      - key: TRIDAPAD_RESULT_METADATA
        value: "true"
      - key: TRIDAPAD_STRICT_QUERY_RESULTS
        value: "true"
      - key: TRIDAPAD_CANCEL_ON_TIMEOUT
        value: "true"
      - key: TRIDAPAD_SERVER_INFO
        value: "true"
      - key: TRIDAPAD_ATOMIC_BUILD
        value: "true"
      - key: TRIDAPAD_DASHBOARD_REFRESH
        value: "true"
      - key: TRIDAPAD_EXPLORE_TOOLS
        value: "true"
      - key: TRIDAPAD_LIBRARY_TOOLS
        value: "true"

envVarGroups:
  - name: tridapad-shared
    envVars:
      - key: TRIDAPAD_LOG_LEVEL
        value: "INFO"
      - key: TRIDAPAD_COOKIE_SECRET
        generateValue: true
      - key: TRIDAPAD_SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: 0
      - key: TRIDAPAD_VERSION_CHECK
        value: "false"
      - key: TRIDAPAD_ENFORCE_CSRF
        value: "true"
      - key: TRIDAPAD_RATELIMIT_ENABLED
        value: "true"
      - key: TRIDAPAD_COOKIES_SECURE
        value: "true"

  # Uncomment and fill the following fields if you wish to set up mailing in TridaPad.
  # It's recommended to use a mail service like Amazon SES, Mailgun, or SendGrid
  # to send emails and ensure deliverability.
